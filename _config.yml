title: DS public
description: Anleitungen für Kolleg:innen ohne technischen Hintergrund
lang: de

# Banner „Work in Progress“ oben auf jeder Seite (false = ausblenden)
wip: true

# Navigation in Header und Footer
navigation:
  - title: Start
    url: /
  - title: Onboarding
    url: /onboarding/claude-regeln-fuer-non-engineers.html
  - title: Übersicht
    url: /anleitungen/uebersicht.html
  - title: Gut mit Claude arbeiten
    url: /gut-mit-claude-arbeiten/gut-mit-claude-arbeiten-als-pm.html

markdown: kramdown
kramdown:
  input: GFM

plugins:
  - jekyll-relative-links
  - jekyll-optional-front-matter
  - jekyll-titles-from-headings

relative_links:
  enabled: true
  collections: false

# Interne Dateien nicht veröffentlichen
exclude:
  - CLAUDE.md
  - README.md

defaults:
  - scope:
      path: ""
    values:
      layout: default
